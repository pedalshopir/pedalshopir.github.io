<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>PEDAL SHOP | Tone Your Way</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--white:#f4f4f1;--muted:#a7a7a2;--gold:#b79a62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a1a1a 0%,var(--bg) 58%);color:var(--white);font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 18px}
main{width:min(100%,420px);text-align:center}
.brand{width:100%;border:1px solid #252525;border-radius:3px;overflow:hidden;background:#050505}
.brand img{display:block;width:100%;height:auto}
.kicker{margin:28px 0 8px;color:var(--gold);font-size:10px;letter-spacing:4px;direction:ltr}
h1{font-size:23px;letter-spacing:3px;direction:ltr;margin:0 0 8px;font-weight:700}
.tagline{font-size:11px;letter-spacing:5px;color:var(--muted);direction:ltr;margin:0 0 28px}
.links{display:grid;gap:10px}
a.btn{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--white);background:linear-gradient(110deg,#151515,#101010);border:1px solid var(--line);padding:16px 18px;min-height:56px;transition:.2s}
a.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.label{font-size:14px;letter-spacing:1.5px;direction:ltr}
.hint{font-size:11px;color:var(--muted);direction:ltr}
.arrow{color:var(--gold);font-size:18px}
footer{margin-top:28px;padding-top:17px;border-top:1px solid #242424;color:#777;font-size:10px;letter-spacing:3px;direction:ltr}
.small{font-size:11px;color:#777;margin-top:16px;line-height:1.9}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="pedalshop-logo.jpg" alt="PEDAL SHOP — TONE YOUR WAY"></div>
  <div class="kicker">GUITAR EFFECTS & GEAR</div>
  <h1>PEDAL SHOP</h1>
  <p class="tagline">TONE YOUR WAY</p>
  <section class="links" aria-label="Contact links">
    <a class="btn" href="https://instagram.com/pedalshop.ir" target="_blank" rel="noopener">
      <span class="label">INSTAGRAM</span><span class="hint">@pedalshop.ir</span><span class="arrow">↗</span>
    </a>
    <a class="btn" href="https://t.me/pedalshopir" target="_blank" rel="noopener">
      <span class="label">TELEGRAM</span><span class="hint">@pedalshopir</span><span class="arrow">↗</span>
    </a>
    <a class="btn" href="tel:+989301001907">
      <span class="label">CALL US</span><span class="hint">0930 100 1907</span><span class="arrow">↗</span>
    </a>
  </section>
  <p class="small">برای سفارش، مشاوره و انتخاب صدای مناسب تجهیزاتت، از راه‌های ارتباطی بالا با ما در تماس باش.</p>
  <footer>PEDAL SHOP&nbsp;&nbsp; | &nbsp;&nbsp;TONE YOUR WAY</footer>
</main>
</body>
</html>
